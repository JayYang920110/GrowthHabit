<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GrowthHabit — 讓習慣活成一片珊瑚礁</title>
  <link rel="stylesheet" href="src/styles/main.css">
  <link rel="stylesheet" href="src/styles/animations.css">
</head>
<body>
  <canvas id="ocean"></canvas>
  <div id="date-display"></div>
  <div id="ui-overlay">
    <p id="empty-hint">⬇ 點 ＋ 種下你的第一株珊瑚</p>
    <div id="habit-bar"></div>
    <button id="add-btn" aria-label="新增習慣">＋</button>
  </div>

  <dialog id="add-dialog">
    <form method="dialog">
      <p class="dialog-title">新增習慣</p>
      <input id="habit-input" type="text" placeholder="習慣名稱" maxlength="20" autocomplete="off">
      <button type="submit" value="ok">種下珊瑚</button>
    </form>
  </dialog>

  <dialog id="note-dialog">
    <form method="dialog">
      <p class="dialog-title">今日打卡</p>
      <p id="note-dialog-habit"></p>
      <textarea id="note-input" placeholder="記錄今天的狀況（可略）" maxlength="200" rows="3"></textarea>
      <div class="dialog-actions">
        <button type="submit" value="skip" class="btn-secondary">跳過</button>
        <button type="submit" value="ok">確認打卡</button>
      </div>
    </form>
  </dialog>

  <dialog id="detail-dialog">
    <form method="dialog">
      <p class="dialog-title" id="detail-dialog-title"></p>
      <div id="detail-entries"></div>
      <button type="submit">關閉</button>
    </form>
  </dialog>

  <script type="module" src="src/main.js"></script>
</body>
</html>
